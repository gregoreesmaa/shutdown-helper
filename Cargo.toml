[package]
name = "shutdown-helper"
version = "1.0.12"
edition = "2024"

[dependencies]
constant_time_eq = "0.3"
httparse = "1.10"
system_shutdown = "4"
log = "0.4"
simplelog = "0.12"
dotenvy = "0.15"
windows-service = "0.8"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
