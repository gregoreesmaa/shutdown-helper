name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Prepare Release Artifacts
        run: |
          mkdir release-bundle
          cp target/release/shutdown-helper.exe release-bundle/
          cp setup.ps1 release-bundle/
          # Create a template .env but don't force it
          echo "BIND_ADDRESS=0.0.0.0:7986" > release-bundle/.env
          echo "AUTH_TOKEN=change-me-secret-token" >> release-bundle/.env
          echo "LOG_DIR=logs" >> release-bundle/.env
          Compress-Archive -Path release-bundle/* -DestinationPath shutdown-helper-windows.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: shutdown-helper-windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
