name: Scheduled Version Bump

on:
  schedule:
    # Runs on the 1st of every month at midnight
    - cron: '0 0 1 * *'
  workflow_dispatch: # Allow manual triggering for testing

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump-version.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Update dependencies
        run: cargo update

      - name: Bump patch version
        id: bump-version
        run: |
          # Read current version
          VERSION=$(grep '^version =' Cargo.toml | head -n 1 | cut -d '"' -f 2)
          echo "Current version: $VERSION"

          # Increment patch version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "NEW_VERSION=v$NEW_VERSION" >> $GITHUB_ENV
          echo "New version: $NEW_VERSION"

          # Update Cargo.toml
          sed -i "s/^version = \"$VERSION\"/version = \"$NEW_VERSION\"/" Cargo.toml

      - name: Commit and Tag
        run: |
          NEW_VERSION=$(grep '^version =' Cargo.toml | head -n 1 | cut -d '"' -f 2)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: automated monthly version bump to v$NEW_VERSION"
          git tag "v$NEW_VERSION"
          git push origin main --tags

  release:
    needs: bump-version
    uses: ./.github/workflows/release.yml
    with:
      tag_name: ${{ needs.bump-version.outputs.tag }}
    secrets: inherit
