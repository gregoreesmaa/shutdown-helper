name: Scheduled Version Bump

on:
  schedule:
    # Runs every 97 days at midnight
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual triggering for testing

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    runs-on: windows-latest # Use windows-latest to allow building the exe
    if: always()
    steps:
      - name: Check if it's the 97th day
        id: check-day
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            # Calculate days since epoch and check modulo 97
            DAYS=$(( $(date +%s) / 86400 ))
            if (( DAYS % 97 == 0 )); then
              echo "run=true" >> $GITHUB_OUTPUT
            else
              echo "run=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Checkout code
        if: steps.check-day.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Rust
        if: steps.check-day.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Update dependencies
        if: steps.check-day.outputs.run == 'true'
        run: cargo update

      - name: Bump patch version
        id: bump-version
        if: steps.check-day.outputs.run == 'true'
        shell: bash
        run: |
          # Read current version
          VERSION=$(grep '^version =' Cargo.toml | head -n 1 | cut -d '"' -f 2)
          echo "Current version: $VERSION"

          # Increment patch version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          echo "NEW_VERSION=v$NEW_VERSION" >> $GITHUB_ENV
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

          # Update Cargo.toml
          sed -i "s/^version = \"$VERSION\"/version = \"$NEW_VERSION\"/" Cargo.toml

      - name: Commit and Tag
        if: steps.check-day.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: automated 97-day version bump to ${{ env.NEW_VERSION }}"
          git tag "${{ env.NEW_VERSION }}"
          git push origin main --tags

      - name: Build release
        if: steps.check-day.outputs.run == 'true'
        run: cargo build --release

      - name: Prepare Release Artifacts
        if: steps.check-day.outputs.run == 'true'
        run: |
          mkdir release-bundle
          cp target/release/shutdown-helper.exe release-bundle/
          cp setup.ps1 release-bundle/
          # Create a template .env but don't force it
          echo "BIND_ADDRESS=0.0.0.0:7986" > release-bundle/.env
          echo "AUTH_TOKEN=change-me-secret-token" >> release-bundle/.env
          echo "LOG_DIR=logs" >> release-bundle/.env
          Compress-Archive -Path release-bundle/* -DestinationPath shutdown-helper-windows.zip

      - name: Create Release
        if: steps.check-day.outputs.run == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump-version.outputs.tag }}
          files: shutdown-helper-windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
