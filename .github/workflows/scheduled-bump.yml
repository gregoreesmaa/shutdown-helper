name: Scheduled Version Bump

on:
  schedule:
    # Runs every 97 days at midnight
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual triggering for testing

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    if: always()
    outputs:
      run: ${{ steps.check-day.outputs.run }}
    steps:
      - name: Check if it's the 97th day
        id: check-day
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            # Calculate days since epoch and check modulo 97
            DAYS=$(( $(date +%s) / 86400 ))
            if (( DAYS % 97 == 0 )); then
              echo "run=true" >> $GITHUB_OUTPUT
            else
              echo "run=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Checkout code
        if: steps.check-day.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Rust
        if: steps.check-day.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Update dependencies
        if: steps.check-day.outputs.run == 'true'
        run: cargo update

      - name: Bump patch version
        id: bump-version
        if: steps.check-day.outputs.run == 'true'
        run: |
          # Read current version
          VERSION=$(grep '^version =' Cargo.toml | head -n 1 | cut -d '"' -f 2)
          echo "Current version: $VERSION"

          # Increment patch version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          echo "NEW_VERSION=v$NEW_VERSION" >> $GITHUB_ENV
          echo "New version: $NEW_VERSION"

          # Update Cargo.toml
          sed -i "s/^version = \"$VERSION\"/version = \"$NEW_VERSION\"/" Cargo.toml

      - name: Commit and Tag
        if: steps.check-day.outputs.run == 'true'
        run: |
          NEW_VERSION=$(grep '^version =' Cargo.toml | head -n 1 | cut -d '"' -f 2)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: automated 97-day version bump to v$NEW_VERSION"
          git tag "v$NEW_VERSION"
          git push origin main --tags

  release:
    needs: bump-version
    if: needs.bump-version.outputs.run == 'true'
    uses: ./.github/workflows/release.yml
    secrets: inherit
